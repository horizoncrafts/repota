name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest versions match
        run: |
          versions=$(jq -r .version .claude-plugin/plugin.json .cursor-plugin/plugin.json .codex-plugin/plugin.json | sort -u)
          echo "$versions"
          [ "$(echo "$versions" | wc -l)" -eq 1 ] || { echo "Manifest versions differ"; exit 1; }
      - name: Claude plugin validate
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
